name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Evaluation - golden trajectories must all be right
        run: python -m evals.run --mode scripted --strict --name ci-scripted
      - name: Evaluation - recorded Gemini runs must replay to the same outcome
        run: |
          if ls recordings/*.json >/dev/null 2>&1; then
            python -m evals.run --mode replay --strict --name ci-replay
          else
            echo "No recordings committed yet; skipping replay."
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
